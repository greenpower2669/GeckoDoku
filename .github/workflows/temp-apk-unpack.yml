name: TEMP unpack GeckoDoku APK

on:
  push:
    branches:
      - feature/sudoku-visual-reasoning-v1

permissions:
  actions: read
  contents: write

jobs:
  unpack:
    if: contains(github.event.head_commit.message, '[temp-apk-unpack]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download validated run #450 artifact ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p temp
          curl --fail --location --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -o /tmp/geckodoku-artifact.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/11833471470/zip"

      - name: Unpack APK into temp
        shell: bash
        run: |
          set -euo pipefail
          unzip -q /tmp/geckodoku-artifact.zip -d temp
          test -s temp/GeckoDoku-v0.15.45-dev.apk
          test -s temp/GeckoDoku-v0.15.45-dev.apk.sha256
          (
            cd temp
            sha256sum -c GeckoDoku-v0.15.45-dev.apk.sha256
          )
          ls -lh temp/GeckoDoku-v0.15.45-dev.apk temp/GeckoDoku-v0.15.45-dev.apk.sha256

      - name: Expose direct APK as temporary prerelease asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="temp-geckodoku-0.15.45-dev-run-450"
          if gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "temp/GeckoDoku-v0.15.45-dev.apk#GeckoDoku v0.15.45-dev APK" \
              "temp/GeckoDoku-v0.15.45-dev.apk.sha256#SHA-256" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "$TAG" \
              "temp/GeckoDoku-v0.15.45-dev.apk#GeckoDoku v0.15.45-dev APK" \
              "temp/GeckoDoku-v0.15.45-dev.apk.sha256#SHA-256" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "TEMP GeckoDoku 0.15.45-dev • run 450" \
              --notes "Copie temporaire directe de l'APK extrait côté GitHub depuis l'artefact GREEN du run 38436224654 (#450). Pas une Release produit ni Google Play." \
              --prerelease
          fi
