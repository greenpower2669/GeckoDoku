name: Setup Google Play upload key

on:
  workflow_dispatch:
  push:
    branches:
      - feature/play-upload-signing-v1

permissions:
  contents: write

concurrency:
  group: geckodoku-play-upload-key
  cancel-in-progress: false

jobs:
  generate-upload-key:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[generate-upload-key]')
    runs-on: ubuntu-latest
    env:
      KEY_ALIAS: geckodoku-upload
      UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
      ENCRYPTED_KEYSTORE: .github/signing/geckodoku-upload.jks.enc
      PUBLIC_CERTIFICATE: .github/signing/geckodoku-upload-certificate.pem
      KEY_INFO: .github/signing/geckodoku-upload-key-info.txt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate signing secret
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${UPLOAD_STORE_PASSWORD:-}" ]; then
            echo "::error::Missing repository secret ANDROID_UPLOAD_STORE_PASSWORD."
            exit 1
          fi
          if [ "${#UPLOAD_STORE_PASSWORD}" -lt 24 ]; then
            echo "::error::ANDROID_UPLOAD_STORE_PASSWORD must contain at least 24 characters."
            exit 1
          fi

      - name: Refuse to overwrite an existing upload key
        shell: bash
        run: |
          set -euo pipefail
          if [ -e "$ENCRYPTED_KEYSTORE" ] || [ -e "$PUBLIC_CERTIFICATE" ]; then
            echo "::error::A Google Play upload key is already stored. Refusing to replace it."
            exit 1
          fi

      - name: Generate upload key and public certificate
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p .github/signing

          KEYSTORE="$RUNNER_TEMP/geckodoku-upload.jks"

          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storetype JKS \
            -storepass:env UPLOAD_STORE_PASSWORD \
            -keypass:env UPLOAD_STORE_PASSWORD \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=GeckoDoku Upload, O=GreenPower2669, C=FR"

          keytool -exportcert \
            -rfc \
            -keystore "$KEYSTORE" \
            -storetype JKS \
            -storepass:env UPLOAD_STORE_PASSWORD \
            -alias "$KEY_ALIAS" \
            -file "$PUBLIC_CERTIFICATE"

          openssl enc -aes-256-cbc -pbkdf2 -iter 300000 -salt \
            -in "$KEYSTORE" \
            -out "$ENCRYPTED_KEYSTORE" \
            -pass env:UPLOAD_STORE_PASSWORD

          CERT_SHA256="$(
            openssl x509 -in "$PUBLIC_CERTIFICATE" -outform der \
              | sha256sum \
              | awk '{print toupper($1)}'
          )"

          cat > "$KEY_INFO" <<EOF
          GeckoDoku Google Play upload key
          Alias: $KEY_ALIAS
          Algorithm: RSA 4096
          Keystore format: JKS
          Certificate SHA-256: $CERT_SHA256
          Private key storage: AES-256-CBC / PBKDF2 300000 iterations
          Password source: GitHub Actions secret ANDROID_UPLOAD_STORE_PASSWORD
          EOF

          rm -f "$KEYSTORE"

      - name: Verify encrypted keystore round-trip
        shell: bash
        run: |
          set -euo pipefail
          VERIFY_KEYSTORE="$RUNNER_TEMP/geckodoku-upload-verify.jks"
          VERIFY_CERT="$RUNNER_TEMP/geckodoku-upload-verify.pem"

          openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 \
            -in "$ENCRYPTED_KEYSTORE" \
            -out "$VERIFY_KEYSTORE" \
            -pass env:UPLOAD_STORE_PASSWORD

          keytool -list \
            -keystore "$VERIFY_KEYSTORE" \
            -storetype JKS \
            -storepass:env UPLOAD_STORE_PASSWORD \
            -alias "$KEY_ALIAS" >/dev/null

          keytool -exportcert \
            -rfc \
            -keystore "$VERIFY_KEYSTORE" \
            -storetype JKS \
            -storepass:env UPLOAD_STORE_PASSWORD \
            -alias "$KEY_ALIAS" \
            -file "$VERIFY_CERT"

          cmp "$PUBLIC_CERTIFICATE" "$VERIFY_CERT"
          rm -f "$VERIFY_KEYSTORE" "$VERIFY_CERT"

      - name: Commit encrypted key material and public certificate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$ENCRYPTED_KEYSTORE" "$PUBLIC_CERTIFICATE" "$KEY_INFO"
          git commit -m "chore: store encrypted Google Play upload key [skip ci]"
          git push

      - name: Upload public certificate for Play Console
        uses: actions/upload-artifact@v4
        with:
          name: geckodoku-google-play-upload-certificate
          path: |
            ${{ env.PUBLIC_CERTIFICATE }}
            ${{ env.KEY_INFO }}
          if-no-files-found: error
