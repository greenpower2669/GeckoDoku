name: GeckoDoku HOF phone validation APK

on:
  push:
    branches: [ feature/gecko-hof-sync-v1 ]

permissions:
  contents: read

jobs:
  apk:
    if: github.event.head_commit.message == 'build HOF validation APK'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Prepare Sherpa-ONNX Android AAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl --fail --location --retry 3 \
            -o app/libs/sherpa-onnx-1.13.8.aar \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar"
          echo "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  app/libs/sherpa-onnx-1.13.8.aar" | sha256sum -c -

      - name: Test and build HOF validation APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Name validation APK
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk GeckoDoku-HOF-v1-validation.apk
          test -s GeckoDoku-HOF-v1-validation.apk
          sha256sum GeckoDoku-HOF-v1-validation.apk | tee GeckoDoku-HOF-v1-validation.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: GeckoDoku-HOF-v1-validation
          path: |
            GeckoDoku-HOF-v1-validation.apk
            GeckoDoku-HOF-v1-validation.sha256
