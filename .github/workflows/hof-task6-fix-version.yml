name: HOF Task 6 version fix

on:
  push:
    branches:
      - feature/gecko-hof-sync-v1

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message == 'run HOF Task 6 version fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Apply corrected Task 6 patch
        shell: bash
        run: |
          set -euo pipefail
          awk '/python3 - <<'"'"'PY'"'"'/{flag=1;next} /^[[:space:]]*PY$/{flag=0} flag { sub(/^          /,""); print }' \
            .github/workflows/hof-task6-run2.yml > /tmp/task6_patch.py
          sed -i 's/BuildConfig.VERSION_NAME/packageManager.getPackageInfo(packageName, 0).versionName ?: "unknown"/' /tmp/task6_patch.py
          python3 /tmp/task6_patch.py
          git diff --check

      - name: Prepare Sherpa AAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl --fail --location --retry 3 -o app/libs/sherpa-onnx-1.13.8.aar \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar"
          echo "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  app/libs/sherpa-onnx-1.13.8.aar" | sha256sum -c -

      - name: Verify unit tests and debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Commit verified wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "greenpower2669"
          git config user.email "80179295+greenpower2669@users.noreply.github.com"
          git add app/src/main/java/com/greenpower2669/geckodoku/MainActivity.kt app/src/main/AndroidManifest.xml
          git commit -m "feat: wire Hall sync into real game completions"
          git push origin HEAD:feature/gecko-hof-sync-v1
