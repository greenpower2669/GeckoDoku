            actual="$(sha256sum GeckoDoku-v0.15.45-dev.apk | cut -d ' ' -f1)"
            test "$actual" = "d879a10ea9ece31dcb866fadb83ea438826f52439c9a0881baf4664d569b966d"
          )
          gh release create "$tag" \
            "$dest/GeckoDoku-v0.15.45-dev.apk#GeckoDoku-v0.15.45-dev.apk" \
            "$dest/GeckoDoku-v0.15.45-dev.apk.sha256#GeckoDoku-v0.15.45-dev.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "TEMP GeckoDoku Atelier multitailles H4 • run 550" \
            --notes "APK brut vérifié issu du run #550 GREEN, commit b56fce17. Recherche par rotation 5×5 à 12×12, X-Wing selon taille, profondeur H2-H4. Version de test, non Google Play ; rendement réel à confirmer sur Samsung." \
            --prerelease
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isPrerelease,assets | jq -e '.isPrerelease == true and ([.assets[].name] | index("GeckoDoku-v0.15.45-dev.apk") != null)'
          echo "APK direct: https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/GeckoDoku-v0.15.45-dev.apk" >> "$GITHUB_STEP_SUMMARY"

  # Explicit user-requested direct APK delivery from successful foreground-search build #557.
