            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "TEMP GeckoDoku Atelier Infernal • run 545" \
            --notes "APK Android téléphone de test, artefact vérifié du run #545 GREEN (commit fcc114e4). Inclut générateur en tâche de fond, bibliothèque et export ZIP. Aucun merge main ni publication Play. Tests en conditions réelles et production effective de grilles X-Wing H2 restent à confirmer." \
            --prerelease
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isPrerelease,assets | jq -e '.isPrerelease == true and ([.assets[].name] | index("GeckoDoku-v0.15.45-dev.apk") != null)'
          echo "APK direct: https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/GeckoDoku-v0.15.45-dev.apk" >> "$GITHUB_STEP_SUMMARY"

  # One-time delivery of the verified GREEN #550 multi-size / H4 APK.
  publish_temp_apk_550:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[temp-apk-run550]')
