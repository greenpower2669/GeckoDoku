  android:
    if: ${{ !contains(github.event.head_commit.message, '[temp-apk-run529]') && !contains(github.event.head_commit.message, '[temp-apk-run533]') && !contains(github.event.head_commit.message, '[temp-apk-run539]') && !contains(github.event.head_commit.message, '[temp-apk-run545]') && !contains(github.event.head_commit.message, '[temp-apk-run550]') && !contains(github.event.head_commit.message, '[temp-apk-run557]') && !contains(github.event.head_commit.message, '[temp-apk-run560]') && !contains(github.event.head_commit.message, '[temp-apk-run563]') && !contains(github.event.head_commit.message, '[temp-apk-run568]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Prepare Sherpa-ONNX Android AAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl --fail --location --retry 3 \
            -o app/libs/sherpa-onnx-1.13.8.aar \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar"
          echo "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  app/libs/sherpa-onnx-1.13.8.aar" | sha256sum -c -
          test -s app/libs/sherpa-onnx-1.13.8.aar

      - name: Prepare Piper UPMC Medium Pierre asset
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          archive="$work/upmc-medium.tar.bz2"

          curl --fail --location --retry 3 \
            -o "$archive" \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-fr_FR-upmc-medium.tar.bz2"

          echo "e9830a331a16f6cc5ef3116a287065e015d3495c3f56b974889a266da7f89a7f  $archive" | sha256sum -c -

          tar -xjf "$archive" -C "$work"

          rm -rf assets/tts/piper
          mkdir -p assets/tts/piper

          mv "$work/vits-piper-fr_FR-upmc-medium" \
            assets/tts/piper/pierre

          test -f assets/tts/piper/pierre/fr_FR-upmc-medium.onnx
          test -f assets/tts/piper/pierre/tokens.txt
          test -d assets/tts/piper/pierre/espeak-ng-data

          du -sh assets/tts/piper/pierre

      - name: Restore validated 240p sprite bank from known-good phone APK
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          apk="$work/known-good.apk"

          curl --fail --location --retry 3 \
            -o "$apk" \
            "https://github.com/greenpower2669/GeckoDoku/releases/download/phone-0.15.43-dev-run-403/GeckoDoku-v0.15.43-dev.apk"

          echo "5b4f38049c3c7e8d115b78bef573784084ddec85cd4774d620dd0d76a4ba7a94  $apk" | sha256sum -c -

          mkdir -p "$work/extracted"
          unzip -q "$apk" 'assets/sprites/*' -d "$work/extracted"
          test -d "$work/extracted/assets/sprites"

          rm -rf assets/sprites
          mkdir -p assets
          cp -a "$work/extracted/assets/sprites" assets/sprites

          test -f assets/sprites/index.json
          test -f assets/sprites/banks/240p/bank-manifest.json
          test ! -d assets/sprites/banks/60p
          test ! -d assets/sprites/banks/120p
          test ! -d assets/sprites/banks/480p
          echo "Restored sprite files: $(find assets/sprites/banks/240p -type f | wc -l)"

      - name: Test and build phone APK
        run: gradle :app:testDebugUnitTest :app:assemblePhone --no-daemon

      - name: Verify packaged Pierre and sprite bank
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/phone/app-phone.apk"
          test -s "$apk"
          unzip -l "$apk" | grep -F 'assets/tts/piper/pierre/fr_FR-upmc-medium.onnx'
          unzip -l "$apk" | grep -F 'assets/sprites/index.json'
          unzip -l "$apk" | grep -F 'assets/sprites/banks/240p/bank-manifest.json'

      - name: Resolve app version
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(sed -n 's/.*versionName = \"\([^\"]*\)\".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$APP_VERSION"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Name phone APK
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/phone/app-phone.apk "GeckoDoku-v${APP_VERSION}.apk"
          test -s "GeckoDoku-v${APP_VERSION}.apk"

      - name: Verify SHA-256 of phone APK
        shell: bash
        run: |
          set -euo pipefail
          sha256sum "GeckoDoku-v${APP_VERSION}.apk" | tee "GeckoDoku-v${APP_VERSION}.apk.sha256"
          echo "SHA-256 de l'APK :" >> "$GITHUB_STEP_SUMMARY"
          cat "GeckoDoku-v${APP_VERSION}.apk.sha256" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: GeckoDoku-v${{ env.APP_VERSION }}-phone
          path: |
            GeckoDoku-v${{ env.APP_VERSION }}.apk
            GeckoDoku-v${{ env.APP_VERSION }}.apk.sha256

      - name: Publish phone prerelease
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[phone-release]')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="phone-${APP_VERSION}-run-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            "GeckoDoku-v${APP_VERSION}.apk#GeckoDoku v${APP_VERSION} APK" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "GeckoDoku ${APP_VERSION} • test téléphone" \
            --notes "APK téléphone de test construit automatiquement depuis ${GITHUB_SHA}. Variante phone non débogable, signée avec la clé de test Android ; ne pas utiliser comme signature Google Play." \
            --prerelease

      - name: Promote validated phone release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[phone-publish]')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PREFIX="phone-${APP_VERSION}-run-"
          TAG="$(
            gh release list \
              --repo "${GITHUB_REPOSITORY}" \
              --limit 100 \
              --json tagName,isPrerelease,publishedAt \
            | jq -r --arg prefix "$PREFIX" \
                '.[] | select(.isPrerelease == true and (.tagName | startswith($prefix))) | .tagName' \
            | head -n 1
          )"

          test -n "$TAG"

          gh release edit "$TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --prerelease=false \
            --latest \
            --title "GeckoDoku ${APP_VERSION} • téléphone validé" \
            --notes "APK téléphone validé. Variante phone non débogable, signée avec la clé de test Android ; ne pas utiliser comme signature Google Play."
