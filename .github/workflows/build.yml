name: Build GeckoDoku APK + AAB

on:
  push:
    branches: [ main, gecko-022-rich-media, gecko-024-grid-audio, gecko-025-canonical-gecko-prof, gecko-026-floating-prof-ui, gecko-027-prof-foreground, gecko-028-prof-voice-idle-mask, gecko-029-more-life-full-celebration, gecko-030-restore-prof-video, gecko-031-voice-ab-experiment, gecko-032-pierre-medium, gecko-033-identity-prof-life ]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Prepare Sherpa-ONNX Android AAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl --fail --location --retry 3 \
            -o app/libs/sherpa-onnx-1.13.8.aar \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar"
          echo "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  app/libs/sherpa-onnx-1.13.8.aar" | sha256sum -c -
          test -s app/libs/sherpa-onnx-1.13.8.aar

      - name: Prepare Piper UPMC Medium Pierre asset
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          archive="$work/upmc-medium.tar.bz2"

          curl --fail --location --retry 3 \
            -o "$archive" \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-fr_FR-upmc-medium.tar.bz2"

          echo "e9830a331a16f6cc5ef3116a287065e015d3495c3f56b974889a266da7f89a7f  $archive" | sha256sum -c -

          tar -xjf "$archive" -C "$work"

          rm -rf assets/tts/piper
          mkdir -p assets/tts/piper

          mv "$work/vits-piper-fr_FR-upmc-medium" \
            assets/tts/piper/pierre

          test -f assets/tts/piper/pierre/fr_FR-upmc-medium.onnx
          test -f assets/tts/piper/pierre/tokens.txt
          test -d assets/tts/piper/pierre/espeak-ng-data

          du -sh assets/tts/piper/pierre
      - name: Test and build Android
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:bundleDebug --no-daemon
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GeckoDoku-v0.10.9-dev.apk
      - name: Name AAB
        run: cp app/build/outputs/bundle/debug/app-debug.aab GeckoDoku-v0.10.9-dev.aab
      - uses: actions/upload-artifact@v4
        with:
          name: GeckoDoku-v0.10.9-dev-Android
          path: |
            GeckoDoku-v0.10.9-dev.apk
            GeckoDoku-v0.10.9-dev.aab
