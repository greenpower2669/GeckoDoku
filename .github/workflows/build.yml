name: Build GeckoDoku APK + AAB

on:
  push:
    branches: [ main, gecko-022-rich-media, gecko-024-grid-audio, gecko-025-canonical-gecko-prof, gecko-026-floating-prof-ui, gecko-027-prof-foreground, gecko-028-prof-voice-idle-mask, gecko-029-more-life-full-celebration, gecko-030-restore-prof-video, gecko-031-voice-ab-experiment ]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Prepare Sherpa-ONNX Android AAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl --fail --location --retry 3 \
            -o app/libs/sherpa-onnx-1.13.8.aar \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar"
          echo "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  app/libs/sherpa-onnx-1.13.8.aar" | sha256sum -c -
          test -s app/libs/sherpa-onnx-1.13.8.aar

      - name: Prepare Piper LOW + MEDIUM assets
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          low="$work/low.tar.bz2"
          medium="$work/medium.tar.bz2"

          curl --fail --location --retry 3 \
            -o "$low" \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-fr_FR-siwis-low.tar.bz2"
          curl --fail --location --retry 3 \
            -o "$medium" \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-fr_FR-siwis-medium.tar.bz2"

          echo "3d69170c160c8375c4123901a72a3845222b39456d39ab74f5bbd7310952b5af  $low" | sha256sum -c -
          echo "375909aa30842b3a4efa10b1beb1d761af792960ae6873b4d53889f96c66195b  $medium" | sha256sum -c -

          tar -xjf "$low" -C "$work"
          tar -xjf "$medium" -C "$work"

          rm -rf assets/tts/piper
          mkdir -p assets/tts/piper

          mv "$work/vits-piper-fr_FR-siwis-low" \
            assets/tts/piper/low
          mv "$work/vits-piper-fr_FR-siwis-medium" \
            assets/tts/piper/medium

          test -f assets/tts/piper/low/fr_FR-siwis-low.onnx
          test -f assets/tts/piper/low/tokens.txt
          test -d assets/tts/piper/low/espeak-ng-data
          test -f assets/tts/piper/medium/fr_FR-siwis-medium.onnx
          test -f assets/tts/piper/medium/tokens.txt
          test -d assets/tts/piper/medium/espeak-ng-data

          du -sh assets/tts/piper/low assets/tts/piper/medium
      - name: Test and build Android
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:bundleDebug --no-daemon
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GeckoDoku-v0.10.7-voice-ab-exp.apk
      - name: Name AAB
        run: cp app/build/outputs/bundle/debug/app-debug.aab GeckoDoku-v0.10.7-voice-ab-exp.aab
      - uses: actions/upload-artifact@v4
        with:
          name: GeckoDoku-v0.10.7-voice-ab-exp-Android
          path: |
            GeckoDoku-v0.10.7-voice-ab-exp.apk
            GeckoDoku-v0.10.7-voice-ab-exp.aab
