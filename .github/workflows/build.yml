name: Build GeckoDoku phone APK

on:
  push:
    branches: [ main, gecko-022-rich-media, gecko-024-grid-audio, gecko-025-canonical-gecko-prof, gecko-026-floating-prof-ui, gecko-027-prof-foreground, gecko-028-prof-voice-idle-mask, gecko-029-more-life-full-celebration, gecko-030-restore-prof-video, gecko-031-voice-ab-experiment, gecko-032-pierre-medium, gecko-033-identity-prof-life, gecko-038-sudoku-mode, gecko-039-sudoku-tap-gecko-gomoku, gecko-040-resolution-sprite-banks, gecko-041-sprite-240-max, gecko-042-prebuilt-sprite-runtime, gecko-043-sprite-240-only-cleanup, gecko-044-hypothesis-branches, gecko-045-sudoku-hypothesis-pad, gecko-046-stats-trends-resizable, gecko-047-sudoku-persistent-help, gecko-048-sudoku-compact-release, feature/sudoku-visual-reasoning-v1, feature/infernal-nested-depth3-v1, feature/infernal-proof-search-v2, feature/classic-infernal-workshop-v1, feature/classic-workshop-multisize-h4-v2, feature/classic-workshop-continuous-fgs-v3, feature/classic-workshop-no-xwing-v4, feature/classic-workshop-forward-geckos-xwing-v5 ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  # Explicit opt-in only. Publish the EXACT validated phone APK from run #525
  # as an unpacked GitHub Release asset; never copy it to the Git tree.
  publish_temp_apk_529:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[temp-apk-run529]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download validated run 529 APK and publish temporary prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="temp-geckodoku-0.15.45-dev-run-529"
          dest="temp/GeckoDoku-run529"
          mkdir -p "$dest"
          gh run download 38603852806 \
            --repo "$GITHUB_REPOSITORY" \
            --name "GeckoDoku-v0.15.45-dev-phone" \
            --dir "$dest"
          cd "$dest"
          sha256sum -c GeckoDoku-v0.15.45-dev.apk.sha256
          actual="$(sha256sum GeckoDoku-v0.15.45-dev.apk | cut -d' ' -f1)"
          expected="28d0995d5e4b1948ff2351b34d3b99638b225b2f755e856fd036d5238ea8a86e"
          test "$actual" = "$expected"
          test -s GeckoDoku-v0.15.45-dev.apk
          gh release create "$tag" \
            "GeckoDoku-v0.15.45-dev.apk#GeckoDoku-v0.15.45-dev.apk" \
            "GeckoDoku-v0.15.45-dev.apk.sha256#GeckoDoku-v0.15.45-dev.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${GITHUB_SHA}" \
            --title "TEMP GeckoDoku 0.15.45-dev • run 529" \
            --notes "APK de test signé Android, issu du run #529 GREEN. Fichier APK direct, sans ZIP; ne pas publier sur Google Play." \
            --prerelease
          echo "APK direct : https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/GeckoDoku-v0.15.45-dev.apk" >> "$GITHUB_STEP_SUMMARY"

  # Explicit one-time delivery of the validated run #533 phone APK.
  # GitHub Actions ZIP is extracted into temp/ in the runner workspace.
  # Publish the raw APK as a TEMP prerelease asset; never commit a large binary.
  publish_temp_apk_533:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[temp-apk-run533]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract verified run 533 phone APK into temp and publish direct file
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="temp-geckodoku-infernal-depth3-run533"
          dest="temp/GeckoDoku-infernal-depth3-run533"
          mkdir -p "$dest"
          gh run download 38800346305 \
            --repo "$GITHUB_REPOSITORY" \
            --name "GeckoDoku-v0.15.45-dev-phone" \
            --dir "$dest"
          test -s "$dest/GeckoDoku-v0.15.45-dev.apk"
          test -s "$dest/GeckoDoku-v0.15.45-dev.apk.sha256"
          (
            cd "$dest"
            sha256sum -c GeckoDoku-v0.15.45-dev.apk.sha256
            actual="$(sha256sum GeckoDoku-v0.15.45-dev.apk | cut -d ' ' -f1)"
            expected="ce9b504397cfad14c733636ac2dd3016e4aa6e108d1acb9ee556921eb022e3f3"
            test "$actual" = "$expected"
          )
          gh release create "$tag" \
            "$dest/GeckoDoku-v0.15.45-dev.apk#GeckoDoku-v0.15.45-dev.apk" \
            "$dest/GeckoDoku-v0.15.45-dev.apk.sha256#GeckoDoku-v0.15.45-dev.apk.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "TEMP GeckoDoku Infernal depth 3 • run #533" \
            --notes "Build de test du commit d394a65d (run #533 GREEN). APK téléphone non signé Play. ZIP Actions extrait dans temp/GeckoDoku-infernal-depth3-run533 ; APK brut publié sans ZIP ; tests de grilles réelles toujours à compléter. Ne pas publier sur Google Play." \
            --prerelease
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isPrerelease,assets | jq -e '.isPrerelease == true and ([.assets[].name] | index("GeckoDoku-v0.15.45-dev.apk") != null)'
          echo "APK direct : https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/GeckoDoku-v0.15.45-dev.apk" >> "$GITHUB_STEP_SUMMARY"

  # Explicit delivery of raw APK from GREEN build #539.
