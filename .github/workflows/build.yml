name: Build GeckoDoku APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GeckoDoku-v0.7.0-dev.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GeckoDoku-v0.7.0-dev-APK
          path: GeckoDoku-v0.7.0-dev.apk
