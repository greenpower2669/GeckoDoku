name: Build GeckoDoku APK + AAB

on:
  push:
    branches: [ main, gecko-022-rich-media, gecko-024-grid-audio, gecko-025-canonical-gecko-prof, gecko-026-floating-prof-ui, gecko-027-prof-foreground, gecko-028-prof-voice-idle-mask, gecko-029-more-life-full-celebration ]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Test and build Android
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:bundleDebug --no-daemon
      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GeckoDoku-v0.10.4-dev.apk
      - name: Name AAB
        run: cp app/build/outputs/bundle/debug/app-debug.aab GeckoDoku-v0.10.4-dev.aab
      - uses: actions/upload-artifact@v4
        with:
          name: GeckoDoku-v0.10.4-dev-Android
          path: |
            GeckoDoku-v0.10.4-dev.apk
            GeckoDoku-v0.10.4-dev.aab
