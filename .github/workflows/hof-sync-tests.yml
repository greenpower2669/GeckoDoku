name: HOF sync unit tests

on:
  push:
    branches: [ feature/gecko-hof-sync-v1 ]

permissions:
  contents: write

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Patch frozen completion timestamp wiring
        if: github.event.head_commit.message == 'run HOF timestamp patch 2'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/greenpower2669/geckodoku/MainActivity.kt')
          text = path.read_text(encoding='utf-8')

          seconds_anchor = '''        if (!completionRecorded) {
            val seconds =
                (
                    SystemClock
                        .elapsedRealtime() -
                        gameStartedAt
                    ) / 1000L

            statsStore.recordComplete(
          '''
          seconds_replacement = '''        if (!completionRecorded) {
            val seconds =
                (
                    SystemClock
                        .elapsedRealtime() -
                        gameStartedAt
                    ) / 1000L

            val completedAt =
                System.currentTimeMillis()

            statsStore.recordComplete(
          '''
          if text.count(seconds_anchor) != 1:
              raise SystemExit(f'seconds anchor count={text.count(seconds_anchor)}')
          text = text.replace(seconds_anchor, seconds_replacement, 1)

          hall_anchor = '''                    completedAt =
                        System.currentTimeMillis()
          '''
          hall_replacement = '''                    completedAt =
                        completedAt
          '''
          if text.count(hall_anchor) != 1:
              raise SystemExit(f'hall timestamp anchor count={text.count(hall_anchor)}')
          text = text.replace(hall_anchor, hall_replacement, 1)

          bridge_anchor = '''                gomokuMatchMode =
                    gomokuMatchMode,
                beeGeckoPuzzle = beeGeckoPuzzle
            )
          '''
          bridge_replacement = '''                gomokuMatchMode =
                    gomokuMatchMode,
                beeGeckoPuzzle = beeGeckoPuzzle,
                completedAt = completedAt
            )
          '''
          if text.count(bridge_anchor) != 1:
              raise SystemExit(f'bridge anchor count={text.count(bridge_anchor)}')
          text = text.replace(bridge_anchor, bridge_replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check

      - name: Prepare Sherpa-ONNX Android AAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl --fail --location --retry 3 \
            -o app/libs/sherpa-onnx-1.13.8.aar \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar"
          echo "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  app/libs/sherpa-onnx-1.13.8.aar" | sha256sum -c -

      - name: Run JVM unit tests and debug build
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Commit verified timestamp wiring
        if: github.event.head_commit.message == 'run HOF timestamp patch 2'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "greenpower2669"
          git config user.email "80179295+greenpower2669@users.noreply.github.com"
          git add app/src/main/java/com/greenpower2669/geckodoku/MainActivity.kt
          git commit -m "fix: freeze one completion timestamp for local and global Hall"
          git push origin HEAD:feature/gecko-hof-sync-v1
