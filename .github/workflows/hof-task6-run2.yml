name: HOF Task 6 patch runner

on:
  push:
    branches:
      - feature/gecko-hof-sync-v1

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message == 'run HOF Task 6 patch 2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Patch MainActivity and manifest
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/greenpower2669/geckodoku/MainActivity.kt')
          source = path.read_text(encoding='utf-8')

          field_pattern = re.compile(
              r'(\s*private lateinit var hallOfFameStore:\s*\n\s*HallOfFameStore\s*\n)(\s*private lateinit var userDataBackup:)'
          )
          field_replacement = (
              r'\1'
              + '\n'
              + '    private lateinit var globalScoreRuntime:\n'
              + '        GlobalScoreRuntime\n'
              + r'\2'
          )
          source, count = field_pattern.subn(field_replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'globalScoreRuntime field anchor count={count}')

          init_pattern = re.compile(
              r'(\s*hallOfFameStore\s*=\s*\n\s*HallOfFameStore\(this\)\s*\n)(\s*userDataBackup\s*=)'
          )
          init_replacement = (
              r'\1'
              + '\n'
              + '        globalScoreRuntime =\n'
              + '            GlobalScoreRuntime(this).also {\n'
              + '                it.start()\n'
              + '            }\n'
              + r'\2'
          )
          source, count = init_pattern.subn(init_replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'globalScoreRuntime init anchor count={count}')

          method_pattern = re.compile(
              r'(    private fun recordRatedCompletionIfNeeded\(.*?\n    }\n\n    private fun completeGame\()',
              re.S,
          )
          match = method_pattern.search(source)
          if match is None:
              raise SystemExit('rated completion method not found')
          block = match.group(1)
          if block.count('completionRecorded = true') != 1:
              raise SystemExit(
                  'rated completion completionRecorded count=' +
                  str(block.count('completionRecorded = true'))
              )

          publish_lines = [
              '            GlobalScoreCompletionBridge.publish(',
              '                publisher =',
              '                    globalScoreRuntime.publisher,',
              '                playerName =',
              '                    playerProfileStore.playerName,',
              '                mode = mode,',
              '                size = size,',
              '                difficulty = difficulty,',
              '                stars = stars,',
              '                elapsedSeconds = seconds,',
              '                mistakes =',
              '                    mistakeCountForMode(mode),',
              '                assistancePoints =',
              '                    assistancePoints,',
              '                appVersion =',
              '                    BuildConfig.VERSION_NAME,',
              '                classicPuzzle = puzzle,',
              '                sudokuPuzzle = sudokuPuzzle,',
              '                sudokuVisualStyle =',
              '                    if (::gameModePreferences.isInitialized) {',
              '                        gameModePreferences.sudokuVisualStyle',
              '                    } else {',
              '                        null',
              '                    },',
              '                gomokuSnapshot =',
              '                    gomokuEngine?.snapshot(),',
              '                gomokuMatchMode =',
              '                    gomokuMatchMode,',
              '                beeGeckoPuzzle = beeGeckoPuzzle',
              '            )',
              '',
          ]
          publish = '\n'.join(publish_lines)
          block = block.replace(
              '            completionRecorded = true',
              publish + '            completionRecorded = true',
              1,
          )
          source = source[:match.start(1)] + block + source[match.end(1):]

          destroy_pattern = re.compile(
              r'(\s*if \(::professorSpeech\.isInitialized\) \{\s*\n\s*professorSpeech\.release\(\)\s*\n\s*}\s*\n)(\s*fx\.release\(\))'
          )
          destroy_replacement = (
              r'\1'
              + '\n'
              + '        if (::globalScoreRuntime.isInitialized) {\n'
              + '            globalScoreRuntime.stop()\n'
              + '        }\n'
              + r'\2'
          )
          source, count = destroy_pattern.subn(destroy_replacement, source, count=1)
          if count != 1:
              raise SystemExit(f'onDestroy anchor count={count}')

          path.write_text(source, encoding='utf-8')

          manifest_path = Path('app/src/main/AndroidManifest.xml')
          manifest = manifest_path.read_text(encoding='utf-8')
          if 'android.permission.INTERNET' not in manifest:
              marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
              if manifest.count(marker) != 1:
                  raise SystemExit('manifest root anchor missing')
              manifest = manifest.replace(
                  marker,
                  marker
                  + '\n    <uses-permission android:name="android.permission.INTERNET" />'
                  + '\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />',
                  1,
              )
          manifest_path.write_text(manifest, encoding='utf-8')
          PY

      - name: Inspect patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- app/src/main/java/com/greenpower2669/geckodoku/MainActivity.kt app/src/main/AndroidManifest.xml

      - name: Prepare Sherpa AAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl --fail --location --retry 3 -o app/libs/sherpa-onnx-1.13.8.aar "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar"
          echo "633c24321e06b1fe79feafa03ea16cbc0f8a286641e2da3559bac91bdb13bd96  app/libs/sherpa-onnx-1.13.8.aar" | sha256sum -c -

      - name: Verify unit tests and debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Commit verified wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "greenpower2669"
          git config user.email "80179295+greenpower2669@users.noreply.github.com"
          git add app/src/main/java/com/greenpower2669/geckodoku/MainActivity.kt app/src/main/AndroidManifest.xml
          git commit -m "feat: wire Hall sync into real game completions"
          git push origin HEAD:feature/gecko-hof-sync-v1
